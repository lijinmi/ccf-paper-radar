name: collect-arxiv

# 每天北京时间 06:10 抓一次（cron 用 UTC：22:10 UTC = 次日 06:10 北京）
on:
  schedule:
    - cron: "10 22 * * *"
  workflow_dispatch:
    inputs:
      days:
        description: "回溯天数"
        required: false
        default: "3"
      preset:
        description: "cv / wide / ml"
        required: false
        default: "cv"

# 需要往仓库里提交数据，所以要有写权限
permissions:
  contents: write

# 同一时间只允许一个采集任务，避免两次提交撞车
concurrency:
  group: collect-arxiv
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # SQLite 只是去重索引，丢了不影响正确性（会退化成"按 JSONL 重建"），
      # 但保留它能避免每月的分片文件被全量重写。
      - name: 恢复去重索引
        uses: actions/cache@v4
        with:
          path: data/papers.db
          key: papers-db-${{ github.run_id }}
          restore-keys: papers-db-

      - name: 采集
        run: |
          python scripts/collect_arxiv.py \
            --days "${{ github.event.inputs.days || 3 }}" \
            --preset "${{ github.event.inputs.preset || 'cv' }}"

      - name: 提交数据
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/papers
          if git diff --cached --quiet; then
            echo "没有新数据，跳过提交"
          else
            git commit -m "data: arXiv $(date -u +%Y-%m-%d) 增量 ($(git diff --cached --numstat data/papers | awk '{s+=$1} END {print s}') 行)"
            git push
          fi

      - name: 摘要写到 Actions 页面
        if: always()
        run: |
          echo "### arXiv 采集结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          for f in data/papers/*.jsonl; do
            [ -e "$f" ] || continue
            echo "- \`$f\`: $(wc -l < "$f") 篇" >> $GITHUB_STEP_SUMMARY
          done
